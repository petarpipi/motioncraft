    <script>
      // Resolve the motion preference before first paint to avoid a flash of animated layout.
      ;(function () {
        var pref = 'auto'
        try {
          pref = localStorage.getItem('motioncraft:motion') || pref
          if (pref === 'auto' && localStorage.getItem('motioncraft:paused') === 'true') pref = 'off'
        } catch (e) {}
        var system = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var reduced = pref === 'off' || (pref === 'auto' && system)
        document.documentElement.dataset.motion = reduced ? 'reduced' : 'full'
      })()
    </script>
